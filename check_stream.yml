name: Check stream status

on:
  schedule:
    # Каждые 5 минут. GitHub Actions не гарантирует точность до секунды
    # при высокой нагрузке на сервисы — оповещение может прийти с
    # задержкой в пару минут, это нормально для бесплатного варианта.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой Run workflow

# Нужно, чтобы workflow мог закоммитить обновлённый state.json обратно в репозиторий
permissions:
  contents: write

concurrency:
  group: stream-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stream check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL: ${{ secrets.TWITCH_CHANNEL }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python stream_notifier.py

      - name: Commit updated state
        run: |
          git config user.name "stream-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update stream state [skip ci]"
            git push
          else
            echo "state.json не изменился, коммит не нужен"
          fi
